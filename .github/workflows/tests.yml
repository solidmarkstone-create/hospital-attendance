name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: attendance, POSTGRES_USER: attendance, POSTGRES_PASSWORD: ci_password}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: ci_password
      POSTGRES_HOST: 127.0.0.1
      DJANGO_SECRET_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
      - run: pytest -m "not models" --cov=apps --cov=recognition --cov-report=term
