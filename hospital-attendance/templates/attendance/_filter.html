<form class="row g-2 mb-3">
 <div class="col-md-2"><input type="month" name="month" value="{{ month }}" class="form-control form-control-sm"></div>
 <div class="col-md-3"><select name="dep" class="form-select form-select-sm">{% for d in departments %}<option value="{{ d.pk }}" {% if dep.pk == d.pk %}selected{% endif %}>{{ d }}</option>{% endfor %}</select></div>
 <div class="col-md-2"><button class="btn btn-sm btn-outline-secondary">Показать</button></div>
</form>
